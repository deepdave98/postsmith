[project]
name = "postsmith"
version = "0.1.0"
description = "Claude Code skills project: learns a voice from reference posts and writes original LinkedIn/X posts"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "pyyaml>=6.0",
  "pillow>=10.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tools/tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
