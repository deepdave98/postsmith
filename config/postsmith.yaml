# postsmith configuration. Every limit that could drift carries a source and a verified_on date.
version: 1

run:
  writers_default: 3
  writers_quick: 2
  writers_wide: 5
  max_rounds: 3
  max_concurrent_subagents: 20
  tier2_finalists_per_platform: 1      # 2 with --wide
  skip_pairwise_when_lineup_clean: true
  quick_rounds: 2
  quick_lineup_on_tier1_pass: false  # true: one judge-lineup per candidate the moment its merged.json says pass,
                                     # on the Tier 2 seed and build so the finalist's lineup reuses it. A pick of the
                                     # candidate at confidence >= 4 ranks (rank_key), never gates. Off under --quick.

judges:
  judge_model: inherit                 # model for Tier 1 judges; "sonnet"/"opus" allowed
  jury_size: 3
  jury_diverse_models: []              # e.g. ["judge-comedy: opus"]
  evidence_fuzzy_ratio: 0.90
  max_na_by_rejection_before_needs_call: 2

corpus:
  # Style targets: never held out, because every one of them has to be able to teach, and they lead the lens
  # order until persona.md states its own lens_preferences.
  primary_authors: [james-hawkins]
  small_corpus_max_posts: 24           # under this, or under the per-platform minimum, small-corpus mode is on
  small_corpus_min_per_platform: 6
  heldout_modulo: 4                    # sha256[:8] % this == 0 -> heldout
  heldout_min_per_platform: 4
  author_profile_min_posts: 6
  self_min_samples: 5
  self_min_words: 1500
  exemplars_count: 6
  exemplars_fixed: 2

platforms:
  linkedin:
    max_chars: 3000                    # source: https://www.linkedin.com/help/linkedin/answer/a528176 verified_on 2026-09-17
    fold_mobile_chars: 140             # source: authoredup.com/blog/linkedin-character-limit verified_on 2026-09-17 (approximate)
    fold_desktop_chars: 210            # source: justinwelsh.me anatomy-of-a-viral-linkedin-post verified_on 2026-09-17
    fold_lines: 3
    hashtags_max: 3                    # persona may set lower; default target 0
    emoji_max: 3
    alt_text_max: 120
    length_band_advisory: [1000, 2500] # authoredup, 372K posts
    image_aspect_default: "4:5"
    image_aspects: ["4:5", "1:1"]
    video_aspects: ["9:16", "1:1"]
  x:
    max_chars: 280                     # free tier / timeline cut; source: support.typefully.com posting limitations verified_on 2026-09-17
    long_post_max_chars: 25000         # Premium
    url_weight: 23
    emoji_weight: 2
    cjk_weight: 2
    hashtags_max: 0
    emoji_max: 1
    alt_text_max: 1000
    one_liner_max: 140
    image_aspect_default: "1:1"
    image_aspects: ["1:1", "16:9", "9:16"]
    video_aspects: ["9:16", "1:1"]

media:
  gpt_image:
    on_image_text_max_words: 12
    prompt_words: [80, 200]
    verified_on: "2026-09-17"
    source: "https://developers.openai.com/api/docs/guides/image-prompting"
  nano_banana:
    on_image_text_max_elements: 5
    min_resolution_with_text: "2K"
    verified_on: "2026-09-17"
    source: "https://ai.google.dev/gemini-api/docs/image-generation"
  veo:
    max_prompt_words: 700
    durations: [4, 6, 8]
    dialogue_words_per_second: 2.5
    aspects: ["16:9", "9:16"]
    verified_on: "2026-09-17"
    source: "https://ai.google.dev/gemini-api/docs/veo"
  runway:
    max_prompt_chars: 1000
    duration_range: [2, 10]
    t2v_aspects: ["16:9"]
    i2v_aspects: ["9:16", "1:1", "3:4", "16:9"]
    verified_on: "2026-09-17"
    source: "https://help.runwayml.com/hc/en-us/articles/46974685288467-Creating-with-Gen-4-5"
  negation_words: ["no ", "don't", "do not", "without", "avoid", "never"]
  facts_stale_after_days: 90

overlap:
  ngram_flag: 6
  ngram_fail: 8
  lcs_fail_chars: 40
  phrase_edit_distance: 2
  skeleton_jaccard: 0.15
  sibling_jaccard: 0.5
  near_duplicate_jaccard: 0.8

envelope:
  iqr_widen: 0.5
  pass_score: 0.70

base_rate_downgrade:
  threshold: 0.25
  applies_to: ["P6_emoji", "P8_opener", "P10_contrast_flip", "P16_broetry", "P17_lists", "P14_dashes"]
  never: ["P3_hashtags", "P4_links", "P7_bait", "P19_clickbait", "P9_residue", "P13_specifics"]

calibration:
  every_n_ratings: 20
  min_ratings_for_kappa: 30
  min_system_fails_for_kappa: 8
  kappa_advisory_threshold: 0.4
  lessons_max_lines: 80
  lessons_retire_days: 90
  story_reuse_days: 60

status_nags:
  unrated_days: 2
  metrics_missing_days: 3
  lexicon_refresh_months: 6
  self_target_samples: 8
