# postsmith AI-tell lexicon v1 (machine source of truth; contracts.md section 12).
# This is the tracked base: the research tiers only. The live file style/lexicon.yaml (gitignored) is this plus the
# do_not_reuse phrases learned from your corpus; every tool falls back to this file when the live one is absent.
# Built from docs/design/research-ai-tells.md (sections 1A-1M, 3, 4) and docs/design/content-quality-bar.md section 4.
#
# Entry shape: {phrase, note, since?, regex?, flags?}
#   phrase  - literal phrase (word boundaries applied automatically, whitespace matches any run of whitespace,
#             matching is case-insensitive and NFKC/quote-folded) or, when `regex: true`, a Python regex.
#   flags   - regex flags for `regex: true` entries; default "i" (case-insensitive) + multiline. "" = case-sensitive.
#   since   - model era / date the phrase became a tell (research 1M); refresh every ~6 months (principle P5).
#
# Tiers (research section 1, 6.1 HF-7):
#   t1      near-diagnostic in social copy (AI verbs, abstraction nouns, inflated significance, global openers,
#           throat-clearing, announcement trio, hook templates)          -> P11_cluster: >= 3 hits = hard
#   t2      strong in clusters (adjectives/adverbs, transitions, business buzzwords, hedge-adjacent)
#   t3      weak alone; counts toward the >= 5 across t1+t2+t3 cluster rule
#   claude  Claude-specific tics (generator = Claude; Velitchkov / Santo / PCWorld)  -> P11_cluster: >= 2 hits = hard
#   bait    engagement solicitation (P7_bait, hard)
#   openers stale line-1 openers (P8_opener, hard, base-rate downgradable; line 1 only)
#   closers moralizing / summarizing closers (P12_closer, hard on the last two nonblank lines)
#   residue chatbot residue, placeholders, reply-bot register (P9_residue, hard)
#   clickbait  clickbait framing (P19_clickbait: hard on X, soft on LinkedIn)
#   hedges  hedge stack (P18_hedges: soft at >= 3)
lexicon_version: 6
updated: "2026-10-18"
